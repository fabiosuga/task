quarkus.application.name=task

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/task}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:sa_task}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:tks}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration